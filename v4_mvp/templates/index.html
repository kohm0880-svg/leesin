<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leesin_V4 MVP</title>
  <style>
    :root{color-scheme:light;font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;--line:#d9dfe8;--muted:#6b7280;--bg:#f6f7f9;--panel:#fff;--ink:#172033;--ok:#166534;--warn:#92400e;--bad:#991b1b}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink)} button,input,select,textarea{font:inherit} button{cursor:pointer}
    .topbar{height:58px;background:#111827;color:white;display:flex;align-items:center;padding:0 22px;gap:16px}.brand{font-weight:800}.tag{font-size:12px;color:#cbd5e1}
    .shell{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 58px)} aside{border-right:1px solid var(--line);background:#fbfcfd;padding:16px;overflow:auto} main{padding:22px;overflow:auto}
    .projects-head,.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.project-card,.tree-row,.analysis-card,.proposal-card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px;margin-top:10px}.project-card:hover,.tree-row:hover{border-color:#94a3b8}
    .tree{font-size:14px}.tree-group{margin:14px 0 5px;font-weight:700;color:#334155}.tree-row{padding:9px 10px;margin-top:6px}.muted{color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}.panel h2,.panel h3{margin:0 0 10px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}input,select,textarea{border:1px solid #cbd5e1;border-radius:8px;padding:9px;background:white}textarea{min-height:74px}.primary{border:0;border-radius:8px;padding:9px 13px;background:#111827;color:white}.ghost{border:1px solid #cbd5e1;border-radius:8px;padding:8px 11px;background:white}
    .checks{border:1px solid var(--line);border-radius:8px;padding:8px;max-height:260px;overflow:auto}.check-row{display:flex;align-items:flex-start;gap:8px;padding:8px;border-bottom:1px solid #eef2f7}.check-row:last-child{border-bottom:0}.status{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800}.status-ok{background:#dcfce7;color:var(--ok)}.status-stop{background:#fee2e2;color:var(--bad)}.status-info{background:#fef3c7;color:var(--warn)}
    .result-title{font-size:22px;font-weight:800;margin:6px 0}.result-box{border-left:4px solid #64748b;padding-left:12px;margin:12px 0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #e5e7eb;text-align:left;padding:7px}th{background:#f8fafc}ul{margin:7px 0 0 18px;padding:0}code{background:#f1f5f9;padding:2px 5px;border-radius:5px}
    .chart{border:1px solid var(--line);border-radius:8px;background:#fff;margin-top:10px;padding:8px}.barrow{display:grid;grid-template-columns:90px 1fr 1fr 75px;gap:8px;align-items:center;margin:6px 0;font-size:12px}.bar{height:8px;border-radius:99px;background:#94a3b8}.bar.sieve{background:#475569}.winner{font-weight:700}
    dialog{border:0;border-radius:12px;padding:0;box-shadow:0 20px 70px #0004;max-width:560px;width:92vw}dialog::backdrop{background:#0006}.dialog-body{padding:18px}.empty{border:1px dashed #cbd5e1;padding:20px;border-radius:10px;color:var(--muted);text-align:center}.breadcrumb{font-size:13px;color:#64748b;margin-bottom:10px}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.grid,.columns{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
  </style>
</head>
<body>
  <div class="topbar"><div class="brand">Leesin_V4</div><div class="tag">Project-based experimental information MVP</div></div>
  <div class="shell">
    <aside>
      <div class="projects-head"><strong>Projects</strong><button class="ghost" id="newProjectBtn">+ New</button></div>
      <div id="projectList"></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div id="projectTree"></div>
    </aside>
    <main><div id="mainView"><div class="empty">프로젝트를 선택하세요.</div></div></main>
  </div>

  <dialog id="projectDialog"><div class="dialog-body"><h3>New Project</h3><div class="field"><label>Title</label><input id="projectTitle"></div><div class="field"><label>Description</label><textarea id="projectDescription"></textarea></div><div class="row" style="justify-content:flex-end"><button class="ghost" onclick="projectDialog.close()">Cancel</button><button class="primary" id="createProjectBtn">Create</button></div></div></dialog>
  <dialog id="clusterDialog"><div class="dialog-body"><h3>Add Data Cluster</h3><div class="field"><label>Cluster name</label><input id="clusterName" placeholder="e.g. initial bracket"></div><div class="field"><label>CSV file</label><input type="file" id="clusterFile" accept=".csv,text/csv"></div><div class="field"><label>Protocol label</label><input id="clusterProtocol" placeholder="e.g. prime-benchmark-v1"><span class="muted">같은 분석에 넣을 군집은 동일한 Protocol/Context를 선언해야 합니다.</span></div><div class="field"><label>Context / execution environment</label><textarea id="clusterContext" placeholder="CPU, OS, Python version, repeats, warmup, implementation notes..."></textarea></div><input type="hidden" id="originProposalId"><div class="row" style="justify-content:flex-end"><button class="ghost" onclick="clusterDialog.close()">Cancel</button><button class="primary" id="saveClusterBtn">Save cluster</button></div></div></dialog>

<script>
const state={bootstrap:null,project:null,activeProjectId:null,activeAnalysisId:null};
async function api(path,options={}){const response=await fetch(path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const data=await response.json();if(!response.ok)throw new Error(data.error||'Request failed');return data}
function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
async function loadBootstrap(){state.bootstrap=await api('/api/bootstrap');renderProjects();if(!state.activeProjectId&&state.bootstrap.projects.length)await openProject(state.bootstrap.projects[0].id)}
function renderProjects(){const box=document.getElementById('projectList');box.innerHTML=state.bootstrap.projects.map(p=>`<div class="project-card" onclick="openProject('${esc(p.id)}')"><strong>${esc(p.title)}</strong><div class="muted">${p.clusterCount} clusters · ${p.analysisCount} analyses · ${p.proposalCount} proposals</div></div>`).join('')||'<div class="muted">No projects.</div>'}
async function openProject(projectId){state.activeProjectId=projectId;state.project=await api(`/api/projects/${projectId}`);state.activeAnalysisId=null;renderTree();renderProjectHome()}
function renderTree(){const p=state.project,tree=document.getElementById('projectTree');if(!p){tree.innerHTML='';return}const analyses=p.analyses.slice(0,20).map(a=>`<div class="tree-row" onclick="showAnalysis('${esc(a.id)}')">📄 ${esc(a.id)}</div>`).join('');const clusters=p.clusters.map(c=>`<div class="tree-row" onclick="renderCluster('${esc(c.id)}')">📄 ${esc(c.name)}</div>`).join('');const proposals=p.proposals.slice(0,20).map(pr=>`<div class="tree-row" onclick="renderProposal('${esc(pr.id)}')">📄 ${esc(pr.id)} · ${esc(pr.status)}</div>`).join('');tree.innerHTML=`<div class="tree-group">📁 ${esc(p.title)}</div><div class="tree-group">▾ Data</div>${clusters||'<div class="muted">No clusters</div>'}<div class="tree-group">▾ Questions</div>${state.bootstrap.questions.map(q=>`<div class="tree-row" onclick="renderAnalyze('${esc(q.id)}')">❓ ${esc(q.name)}</div>`).join('')}<div class="tree-group">▾ Analyses</div>${analyses||'<div class="muted">No analyses</div>'}<div class="tree-group">▾ Proposals</div>${proposals||'<div class="muted">No proposals</div>'}`}
function renderProjectHome(){const p=state.project;document.getElementById('mainView').innerHTML=`<div class="breadcrumb">Projects › ${esc(p.title)}</div><div class="section-head"><div><h1 style="margin:0">${esc(p.title)}</h1><div class="muted">${esc(p.description)}</div></div><button class="primary" onclick="openClusterDialog()">+ Add data</button></div><div class="grid" style="margin-top:18px"><section class="panel"><h2>Analyze</h2><p class="muted">알고 싶은 정보를 선택하고, 분석에 넣을 군집을 직접 고릅니다.</p><div class="field"><label>Question</label><select id="questionSelect">${state.bootstrap.questions.map(q=>`<option value="${esc(q.id)}">${esc(q.name)}</option>`).join('')}</select></div><div id="questionDescription" class="muted"></div><div class="field"><div class="row" style="justify-content:space-between"><label>Data clusters</label><label><input type="checkbox" id="selectAllClusters"> Select all</label></div><div class="checks" id="clusterChecks"></div></div><button class="primary" id="analyzeBtn">Analyze selected data</button></section><section class="panel"><h2>Recent analyses</h2>${p.analyses.length?p.analyses.slice(0,6).map(a=>analysisSummaryCard(a)).join(''):'<div class="empty">분석 기록이 아직 없습니다.</div>'}</section></div>`;document.getElementById('questionSelect').addEventListener('change',updateQuestionDescription);document.getElementById('selectAllClusters').addEventListener('change',ev=>document.querySelectorAll('.cluster-check').forEach(cb=>cb.checked=ev.target.checked));document.getElementById('analyzeBtn').addEventListener('click',analyzeSelected);updateQuestionDescription();renderClusterChecks()}
function analysisSummaryCard(a){const label=a.outcome?.status_label||a.status;return `<div class="analysis-card" onclick="showAnalysis('${esc(a.id)}')"><strong>${esc(label)}</strong><div>${esc(a.outcome?.title||a.questionId)}</div><div class="muted">${esc(a.createdAt)}</div></div>`}
function updateQuestionDescription(){const select=document.getElementById('questionSelect');if(!select)return;const q=state.bootstrap.questions.find(item=>item.id===select.value);document.getElementById('questionDescription').innerHTML=`<strong>${esc(q?.module||'')}</strong><br>${esc(q?.description||'')}<br><span class="muted">Required: ${esc((q?.requiredColumns||[]).join(', '))}</span>`}
function renderClusterChecks(){const box=document.getElementById('clusterChecks');if(!box)return;if(!state.project.clusters.length){box.innerHTML='<div class="muted">먼저 CSV 군집을 추가하세요.</div>';return}box.innerHTML=state.project.clusters.map(c=>`<label class="check-row"><input type="checkbox" class="cluster-check" value="${esc(c.id)}"><span><strong>${esc(c.name)}</strong><br><span class="muted">${esc(c.filename)} · protocol=${esc(c.protocol||'(unspecified)')}</span></span></label>`).join('')}
async function analyzeSelected(){const questionId=document.getElementById('questionSelect').value;const clusterIds=[...document.querySelectorAll('.cluster-check:checked')].map(cb=>cb.value);try{const analysis=await api(`/api/projects/${state.project.id}/analyze`,{method:'POST',body:JSON.stringify({questionId,clusterIds})});state.project=await api(`/api/projects/${state.project.id}`);renderTree();showAnalysisObject(analysis)}catch(err){alert(err.message)}}
function statusClass(status){if(status==='ok')return 'status status-ok';if(['assumption_failed','protocol_mismatch','invalid_data'].includes(status))return 'status status-stop';return 'status status-info'}
function previewTable(preview){if(!preview?.length)return '<div class="empty">Preview data가 없습니다.</div>';const max=Math.max(...preview.flatMap(r=>[r.trialMedianMs||0,r.sieveMedianMs||0]),1);const rows=preview.map(r=>{const t=r.trialMedianMs==null?'—':Number(r.trialMedianMs).toFixed(4),s=r.sieveMedianMs==null?'—':Number(r.sieveMedianMs).toFixed(4),tw=r.trialMedianMs==null?0:Math.max(2,(r.trialMedianMs/max)*100),sw=r.sieveMedianMs==null?0:Math.max(2,(r.sieveMedianMs/max)*100);return `<div class="barrow"><div>N=${esc(r.N)}</div><div><div class="bar" style="width:${tw}%"></div><span>${t} ms</span></div><div><div class="bar sieve" style="width:${sw}%"></div><span>${s} ms</span></div><div class="winner">${esc(r.winner||'incomplete')}</div></div>`}).join('');return `<table><thead><tr><th>N</th><th>Trial median</th><th>Sieve median</th><th>Winner</th></tr></thead><tbody>${preview.map(r=>`<tr><td>${esc(r.N)}</td><td>${r.trialMedianMs==null?'—':Number(r.trialMedianMs).toFixed(6)}</td><td>${r.sieveMedianMs==null?'—':Number(r.sieveMedianMs).toFixed(6)}</td><td>${esc(r.winner||'incomplete')}</td></tr>`).join('')}</tbody></table><div class="chart"><div class="muted">Runtime preview — trial / sieve</div>${rows}</div>`}
function listHtml(items){return items?.length?`<ul>${items.map(item=>`<li>${esc(item)}</li>`).join('')}</ul>`:'<div class="muted">None</div>'}
function showAnalysis(id){const analysis=state.project.analyses.find(item=>item.id===id);if(analysis)showAnalysisObject(analysis)}
function showAnalysisObject(analysis){state.activeAnalysisId=analysis.id;const o=analysis.outcome||{},proposal=analysis.proposal||state.project.proposals.find(p=>p.id===analysis.proposalId);document.getElementById('mainView').innerHTML=`<div class="breadcrumb">Projects › ${esc(state.project.title)} › Analyses › ${esc(analysis.id)}</div><section class="panel"><span class="${statusClass(o.status)}">${esc(o.status_label||o.status)}</span><div class="result-title">${esc(o.title)}</div><div class="result-box">${esc(o.summary)}</div><div class="muted">Question: ${esc(analysis.questionId)} · Module ${esc(analysis.moduleVersion)} · auto-saved ${esc(analysis.createdAt)}</div></section><section class="panel"><h2>Preview</h2>${previewTable(o.preview)}</section><div class="columns"><section class="panel"><h3>Assumptions</h3>${listHtml(o.assumptions)}</section><section class="panel"><h3>Limits</h3>${listHtml(o.limits)}</section></div><section class="panel"><h3>Diagnostics</h3>${listHtml(o.diagnostics)}</section><section class="panel"><h2>Next</h2>${proposal?proposalHtml(proposal):'<div class="empty">이 Analysis에서는 다음 실험을 자동 제안하지 않습니다.</div>'}</section>`}
function proposalHtml(proposal){const p=proposal.payload||{},n=p.input?.N;return `<div class="proposal-card"><strong>Proposal ${esc(proposal.id)}</strong><div class="result-title">${n==null?'Next observation':`N = ${esc(n)}`}</div><p>${esc(p.reason||'')}</p><p class="muted">${esc(p.repeatInstruction||'')}</p>${p.commandTemplate?`<div><code>${esc(p.commandTemplate)}</code></div>`:''}<div class="row" style="margin-top:12px"><button class="primary" onclick="startProposal('${esc(proposal.id)}')">Start next experiment</button><span class="muted">Status: ${esc(proposal.status)}</span></div></div>`}
async function startProposal(proposalId){try{const p=await api(`/api/projects/${state.project.id}/proposals/${proposalId}/start`,{method:'POST',body:'{}'});state.project=await api(`/api/projects/${state.project.id}`);renderTree();openClusterDialog(proposalId,p.payload?.input?.N)}catch(err){alert(err.message)}}
function renderCluster(clusterId){const c=state.project.clusters.find(item=>item.id===clusterId);if(!c)return;document.getElementById('mainView').innerHTML=`<div class="breadcrumb">Projects › ${esc(state.project.title)} › Data › ${esc(c.name)}</div><section class="panel"><h2>${esc(c.name)}</h2><div class="muted">${esc(c.filename)} · ${esc(c.createdAt)}</div><p><strong>Protocol</strong><br>${esc(c.protocol||'(unspecified)')}</p><p><strong>Context</strong><br>${esc(c.context||'(unspecified)')}</p><p><strong>Content hash</strong><br><code>${esc(c.contentHash)}</code></p><details><summary>Raw CSV</summary><pre style="white-space:pre-wrap">${esc(c.csvText)}</pre></details></section>`}
function renderAnalyze(questionId){renderProjectHome();const select=document.getElementById('questionSelect');select.value=questionId;updateQuestionDescription()}
function renderProposal(proposalId){const p=state.project.proposals.find(item=>item.id===proposalId);if(!p)return;document.getElementById('mainView').innerHTML=`<div class="breadcrumb">Projects › ${esc(state.project.title)} › Proposals › ${esc(p.id)}</div><section class="panel"><h2>Proposal</h2>${proposalHtml(p)}</section>`}
function openClusterDialog(originProposalId='',suggestedN=''){document.getElementById('originProposalId').value=originProposalId||'';document.getElementById('clusterName').value=suggestedN?`N=${suggestedN}`:'';document.getElementById('clusterFile').value='';if(state.project?.clusters?.length){const last=state.project.clusters[state.project.clusters.length-1];document.getElementById('clusterProtocol').value=last.protocol||'';document.getElementById('clusterContext').value=last.context||''}clusterDialog.showModal()}
document.getElementById('saveClusterBtn').addEventListener('click',async()=>{const file=document.getElementById('clusterFile').files[0];if(!file){alert('CSV 파일을 선택하세요.');return}const csvText=await file.text();try{await api(`/api/projects/${state.project.id}/clusters`,{method:'POST',body:JSON.stringify({name:document.getElementById('clusterName').value,filename:file.name,csvText,protocol:document.getElementById('clusterProtocol').value,context:document.getElementById('clusterContext').value,originProposalId:document.getElementById('originProposalId').value||null})});clusterDialog.close();state.project=await api(`/api/projects/${state.project.id}`);renderTree();renderProjectHome();await loadBootstrap()}catch(err){alert(err.message)}});
document.getElementById('newProjectBtn').addEventListener('click',()=>projectDialog.showModal());document.getElementById('createProjectBtn').addEventListener('click',async()=>{try{const p=await api('/api/projects',{method:'POST',body:JSON.stringify({title:document.getElementById('projectTitle').value,description:document.getElementById('projectDescription').value})});projectDialog.close();await loadBootstrap();await openProject(p.id)}catch(err){alert(err.message)}});
loadBootstrap().catch(err=>{document.getElementById('mainView').innerHTML=`<div class="panel" style="color:#991b1b">${esc(err.message)}</div>`});
</script>
</body>
</html>
